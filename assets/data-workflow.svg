<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">How I approach a project</title>
  <desc id="workflow-description">Four connected blocks: ask a business question, organize the data, analyze the patterns, and explain the next step. This is a conceptual workflow, not measured project results.</desc>
  <defs>
    <linearGradient id="connection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60e1cf"/>
      <stop offset="1" stop-color="#a7a9ff"/>
    </linearGradient>
  </defs>
  <path d="M100 88h1000" fill="none" stroke="url(#connection)" stroke-width="3"/>
  <g fill="#101b2b" stroke="#364962" stroke-width="2">
    <rect x="2" y="14" width="268" height="148" rx="12"/>
    <rect x="312" y="14" width="268" height="148" rx="12"/>
    <rect x="622" y="14" width="268" height="148" rx="12"/>
    <rect x="932" y="14" width="266" height="148" rx="12"/>
  </g>
  <g fill="#60e1cf" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" text-anchor="middle">
    <text x="136" y="53">01 / QUESTION</text>
    <text x="446" y="53">02 / ORGANIZE</text>
    <text x="756" y="53">03 / ANALYZE</text>
    <text x="1065" y="53">04 / EXPLAIN</text>
  </g>
  <g fill="#f2f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">
    <text x="136" y="97">Start with why</text>
    <text x="446" y="97">Shape the data</text>
    <text x="756" y="97">Find the pattern</text>
    <text x="1065" y="97">Make it useful</text>
  </g>
  <g fill="#b6c7dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="middle">
    <text x="136" y="132">Business context</text>
    <text x="446" y="132">Tables + validation</text>
    <text x="756" y="132">Models + queries</text>
    <text x="1065" y="132">Reports + next steps</text>
  </g>
</svg>
